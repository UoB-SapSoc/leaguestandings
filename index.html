<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Test Site</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin-top: 50px;
    }
    h1 {
      color: #333;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🚀 It works!</h1>
  <p>If you can see this on your GitHub Pages site, you're live.</p>

  <button onclick="showMessage()">Click me</button>

  <p id="message"></p>

  <script>
    function showMessage() {
      document.getElementById("message").textContent = "JavaScript is working 🎉";
    }
  </script>

</body>
</html>
